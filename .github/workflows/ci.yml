name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ python3
      - name: Configure C++23
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Governance baseline
        run: python3 scripts/validate_governance_repo.py
      - name: Praxis doctor
        run: PRAXIS_HOME="$PWD" ./build/praxis doctor
